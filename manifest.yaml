{
  "id": "makie",
  "name": "Makie",
  "version": "0.1.0",
  "description": "Discord bot with Storyden robot replies and occasional wilted-rose reactions",
  "access":
    {
      "handle": "makie",
      "name": "Makie",
      "permissions": ["USE_ROBOTS", "MANAGE_ROBOTS", "UPLOAD_ASSET"],
    },
  "author": "southclaws",
  "command": "./main.exe",
  "configuration_schema":
    {
      "fields":
        [
          {
            "description": "The Discord bot token for authentication",
            "id": "discord_token",
            "label": "Discord Bot Token",
            "type": "string",
          },
          {
            "description": "The Discord user ID of the Makie bot account, used to detect mentions and flag its own messages in conversation history",
            "id": "discord_bot_id",
            "label": "Discord Bot User ID",
            "type": "string",
          },
          {
            "description": "Optional TypeSafe API key for server-wide 🥀 reactions. Enable Message Content Intent in the Discord Developer Portal first. Leave blank to disable.",
            "id": "typesafe_api_key",
            "label": "TypeSafe API Key",
            "type": "string",
          },
          {
            "default": "denbot",
            "description": "The Storyden robot ID used to generate Discord replies",
            "id": "robot_id",
            "label": "Robot ID",
            "type": "string",
          },
        ],
    },
}
